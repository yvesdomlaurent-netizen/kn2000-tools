plugins {
    id 'com.android.application'
}

android {
    namespace 'net.yvesdomlaurent.knbridge'
    compileSdk 34

    defaultConfig {
        applicationId "net.yvesdomlaurent.knbridge"
        minSdk 23
        targetSdk 34
        versionCode 2
        versionName "1.2"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}
