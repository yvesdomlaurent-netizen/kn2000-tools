plugins {
    id 'com.android.application'
}

android {
    namespace 'net.yvesdomlaurent.knbridge'
    compileSdk 34

    defaultConfig {
        applicationId "net.yvesdomlaurent.knbridge"
        minSdk 23
        targetSdk 34
        versionCode 3
        versionName "1.3"
    }

    // Signature debug STABLE (keystore commite dans le repo, genere par la CI)
    // -> les mises a jour futures s'installent PAR-DESSUS l'appli existante.
    signingConfigs {
        stableDebug {
            storeFile rootProject.file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.stableDebug
        }
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}
