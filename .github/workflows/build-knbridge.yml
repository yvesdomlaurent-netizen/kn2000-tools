name: build-knbridge

permissions:
  contents: write

on:
  push:
    branches: [ main ]
    paths:
      - 'android/knbridge/**'
      - '.github/workflows/build-knbridge.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Keystore debug stable
        working-directory: android/knbridge
        run: |
          if [ ! -f debug.keystore ]; then
            keytool -genkeypair -keystore debug.keystore -storepass android \
              -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 \
              -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
            git config user.name "github-actions"
            git config user.email "actions@github.com"
            git add debug.keystore
            git commit -m "[skip ci] keystore debug stable (signature permanente KN Bridge)"
            git push
          fi

      - name: Build debug APK
        working-directory: android/knbridge
        run: |
          set -o pipefail
          gradle assembleDebug --no-daemon --stacktrace 2>&1 | tee ../../gradle.log

      - name: Pousser le log de build en cas d'échec
        if: failure()
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -f gradle.log
          git commit -m "ci: log de build knbridge (échec)"
          git push

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: knbridge-apk
          path: android/knbridge/app/build/outputs/apk/debug/app-debug.apk

      - name: Publish APK to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: knbridge-v5
          name: KN Bridge v1.5
          body: |
            KN Bridge v1.5 : statut du service + bouton Arrêter dans le panneau + filtre FE.
            Port d'entrée "Commande MS", port de sortie "Vers Page".
            APK debug signe avec cle stable : s'installe par-dessus la v1.2.
          files: android/knbridge/app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
